services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - HUB_URL=https://beszel.njcq.dpdns.org
      - TOKEN=${TOKEN}
      - KEY=${KEY}
      - DISABLE_SSH=true
      - SYSTEM_NAME=oci-osaka
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - beszel_agent_data:/var/lib/beszel-agent
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  beszel_agent_data:
    name: beszel_agent_data
