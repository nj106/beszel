services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - APP_URL=https://beszel.njcq.dpdns.org
      - USER_EMAIL=${USER_EMAIL}
      - USER_PASSWORD=${USER_PASSWORD}
      - DISABLE_SSH=true
    volumes:
      - beszel_data:/beszel_data
    network_mode: bridge
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  beszel_data:
    name: beszel_data
